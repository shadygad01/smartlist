name: "[UTILITY] Backfill Research DB"

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore live data from data branch
        run: bash ci/restore_data.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB backfill
        run: python backfill_research_db.py

      - name: Persist updated DB to data branch
        run: |
          # Force WAL checkpoint so the main DB file is fully written before git reads it
          python3 -c "import sqlite3; c=sqlite3.connect('egx_research.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()" 2>/dev/null || true
          ls -lh egx_research.db 2>/dev/null || echo "WARNING: egx_research.db not found"
          ls -lh research_results.json 2>/dev/null || echo "INFO: research_results.json not present (optional)"
          bash ci/save_data.sh "Backfill research DB from signal_history [skip ci]"
