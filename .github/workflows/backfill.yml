name: Backfill Research DB

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DB backfill
        run: python backfill_research_db.py

      - name: Commit updated DB
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f egx_research.db research_results.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Backfill research DB from signal_history [skip ci]"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git pull origin "$BRANCH" --rebase || true
          git push origin HEAD:"$BRANCH" || true
