name: Backfill Historical Positions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install APScheduler --upgrade

      - name: Run backfill
        run: python backfill_positions.py

      - name: Commit updated positions
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json
          git diff --staged --quiet || git commit -m "Backfill: register historical positions since 2026-01-01 [skip ci]"
          git push || true
