name: Backfill Historical Positions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = preview only, false = save to file)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install APScheduler --upgrade

      - name: Run backfill
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python backfill_positions.py

      - name: Commit updated positions
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json
          git diff --staged --quiet || git commit -m "Backfill: register historical positions since 2026-01-01 [skip ci]"
          git push || true
