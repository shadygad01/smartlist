name: Build Signal History (Backtest)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install APScheduler --upgrade

      - name: Run backtest
        run: python backtest_signals.py

      - name: Commit signal history
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add signal_history.json
          git diff --staged --quiet || git commit -m "Backtest: build full signal history from real historical data [skip ci]"
          git push || true
