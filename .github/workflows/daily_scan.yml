name: EGX Daily Scanner

on:
  schedule:
    # Daily report الساعة 9:00 صبح Cairo
    # November-April: 7:00 UTC (EET = UTC+2)
    - cron: '0 7 * * 0-4'
    # May-October: 6:00 UTC (EEST = UTC+3)
    - cron: '0 6 * * 1-5'

    # كل 5 دقائق من 08:00 لـ 11:55 UTC (= 10:00–13:55 Cairo in winter, 9:00-12:55 in summer)
    # Winter schedule (Nov-Apr): 08:00-11:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'
    # Summer schedule (May-Oct): 07:00-10:55 UTC (= 10:00-13:55 Cairo)
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-10 * * 1-5'

    # كل 5 دقائق من 12:00 لـ 12:30 UTC (= 14:00–14:30 Cairo in winter)
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'
    # Summer schedule: 11:00-11:30 UTC (= 14:00-14:30 Cairo)
    - cron: '0,5,10,15,20,25,30 11 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install APScheduler --upgrade

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'True' || 'False' }}
        run: python main.py

      - name: Save updated positions
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json scan_results.json || true
          git diff --staged --quiet || git commit -m "Auto-update positions [skip ci]"
          git push || true
