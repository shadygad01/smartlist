name: EGX Daily Scanner

on:
  schedule:
    - cron: '30 13 * * 0-4'   # 1:30 PM UTC = 3:30 PM Cairo (UTC+2)
  workflow_dispatch:            # تشغيل يدوي لو احتجت تختبر

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance requests beautifulsoup4

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py
