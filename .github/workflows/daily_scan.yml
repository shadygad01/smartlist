name: EGX Daily Scanner

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # Daily report الساعة 7:00 صبح Cairo
    # Summer (EEST = UTC+3): 04:00 UTC
    - cron: '0 4 * * 0-4'
    # Winter (EET  = UTC+2): 05:00 UTC
    - cron: '0 5 * * 0-4'

    # كل 5 دقائق من 10:00 لـ 13:55 Cairo
    # Summer (UTC+3): 07:00-10:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-10 * * 0-4'
    # Winter (UTC+2): 08:00-11:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'

    # 14:00-14:30 Cairo
    # Summer (UTC+3): 11:00-11:30 UTC
    - cron: '0,5,10,15,20,25,30 11 * * 0-4'
    # Winter (UTC+2): 12:00-12:30 UTC
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'

  workflow_dispatch:
    inputs:
      force_daily:
        description: 'Force daily scan (test automatic path — no Manual label)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# منع تراكم الـ runs — لو run جديد جاي، يلغي القديم
concurrency:
  group: egx-scanner
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ── A ── Core scanner + database preparation ──────────────────────────────
  scan_core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_DAILY: >-
            ${{
              (github.event.schedule == '0 4 * * 0-4' ||
               github.event.inputs.force_daily == 'true')
              && 'True' || 'False'
            }}
          PYTHONUNBUFFERED: "1"
          MANUAL_RUN: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               github.event.inputs.force_daily != 'true')
              && 'True' || 'False'
            }}
        run: python main.py

      - name: Prepare research database
        run: |
          python backfill_research_db.py || true
          python backfill_signal_log_smc.py || true
          python historical_backtest.py --append || true
          python backfill_hist_features.py || true
          python extend_metrics.py || true
          python -c "from backfill_research_db import ensure_combined_view; ensure_combined_view()" || true

      - name: Save state to git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json scan_results.json \
                  signal_history.json signal_log.json learned_weights.json \
                  egx_research.db research_results.json || true
          git diff --staged --quiet || git commit -m "Auto-update positions and research DB [skip ci]"
          git push || true

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: egx-research-db
          path: |
            egx_research.db
            historical_backtest_results.json
            historical_backtest_report_*.html
          retention-days: 1

  # ── B ── Research reports (parallel with C) ───────────────────────────────
  research_reports:
    needs: scan_core
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: egx-research-db

      - name: Generate reports
        env:
          WEB_OUT: ./web_deploy
          REPORT_EMAIL_FROM: ${{ secrets.EMAIL_USER }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          mkdir -p web_deploy
          (python heatmap.py || true) &
          (python research_report.py --no-email --force || true) &
          (python quant_research_report.py || true) &
          wait
          python - <<'PYEOF'
          import glob, shutil
          for pattern, dest in [
              ("historical_backtest_report_*.html", "web_deploy/historical_backtest_report.html"),
              ("research_report_*.html",            "web_deploy/research_report.html"),
              ("quant_research_report_*.html",      "web_deploy/quant_research_report.html"),
          ]:
              files = sorted(glob.glob(pattern))
              if files:
                  shutil.copy(files[-1], dest)
                  print(f"Copied {files[-1]} -> {dest}")
              else:
                  print(f"WARNING: no {pattern} found")
          PYEOF
          cp historical_backtest_results.json web_deploy/ || true
          cp manifest.json sw.js icon.svg web_deploy/ || true

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-web
          path: web_deploy/
          retention-days: 1

  # ── C ── Intelligence engines (parallel with B) ───────────────────────────
  intelligence_jobs:
    needs: scan_core
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: egx-research-db

      - name: Run intelligence engines — tier 1 (parallel)
        run: |
          (python rule_discovery.py && python edge_report.py || true) &
          (python behavior_report.py && python backtest_analysis.py || true) &
          (python logic_analyzer.py || true) &
          (python weight_optimizer.py || true) &
          (python system_audit.py || true) &
          (python adaptive_learning.py || true) &
          (python gx_learning_layer.py || true) &
          wait
        continue-on-error: true

      - name: Run intelligence engines — tier 2 (depends on tier 1)
        run: |
          python decision_engine.py || true
          python discount_zone_miner.py || true
        continue-on-error: true

      - name: Collect intelligence artifacts
        run: |
          mkdir -p web_deploy
          python - <<'PYEOF'
          import glob, shutil
          mappings = [
              ("edge_discovery_report_*.html",         "web_deploy/edge_report.html"),
              ("logic_analysis_report_*.html",         "web_deploy/logic_analysis_report.html"),
              ("weight_optimizer_report_*.html",       "web_deploy/weight_optimizer_report.html"),
              ("system_audit_report_*.html",           "web_deploy/system_audit_report.html"),
              ("adaptive_learning_report_*.html",      "web_deploy/adaptive_learning_report.html"),
              ("reports/gx_learning_report_*.html",    "web_deploy/gx_learning_report.html"),
              ("reports/decision_engine_report_*.html","web_deploy/decision_engine_report.html"),
              ("reports/discount_zone_report_*.html",  "web_deploy/discount_zone_report.html"),
          ]
          for pattern, dest in mappings:
              files = sorted(glob.glob(pattern))
              if files:
                  shutil.copy(files[-1], dest)
                  print(f"Copied {files[-1]} -> {dest}")
              else:
                  print(f"WARNING: no {pattern} found")
          PYEOF
          cp behavior_report.html     web_deploy/behavior_report.html  || true
          cp backtest_report.html     web_deploy/backtest_report.html   || true
          cp logic_analysis_results.json    web_deploy/ || true
          cp optimization_results.json      web_deploy/ || true
          cp system_audit_results.json      web_deploy/ || true
          cp adaptive_learning_results.json web_deploy/ || true
          cp gx_learning_memory.json        web_deploy/ || true
          cp decision_engine_results.json   web_deploy/ || true
          cp discount_zone_patterns.json    web_deploy/ || true

      - name: Upload intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-web
          path: web_deploy/
          retention-days: 1

  # ── D ── Dashboard (after B + C) ─────────────────────────────────────────
  dashboard_build:
    needs: [research_reports, intelligence_jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download research artifacts
        uses: actions/download-artifact@v4
        with:
          name: research-web
          path: web_deploy/
        continue-on-error: true

      - name: Download intelligence artifacts
        uses: actions/download-artifact@v4
        with:
          name: intelligence-web
          path: web_deploy/
        continue-on-error: true

      - name: Generate Master Dashboard
        run: |
          python dashboard.py || true
          cp dashboard.html web_deploy/index.html || true

      - name: Upload final web deploy
        uses: actions/upload-artifact@v4
        with:
          name: final-web-deploy
          path: web_deploy/
          retention-days: 1

  # ── E ── Deploy ───────────────────────────────────────────────────────────
  deploy:
    needs: dashboard_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download final web deploy
        uses: actions/download-artifact@v4
        with:
          name: final-web-deploy
          path: web_deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          force_orphan: true
          commit_message: "Deploy dashboard [skip ci]"
