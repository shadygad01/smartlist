name: EGX Daily Scanner

on:
  schedule:
    # كل 5 دقائق طول اليوم (الـ script سيتحقق من الأوقات)
    - cron: '*/5 7-12,13-16 * * 0-4'  # 07:00-12:59 و 13:00-16:59 UTC = 09:00-14:59 و 15:00-18:59 Cairo
  workflow_dispatch:  # تشغيل يدوي

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python main.py
