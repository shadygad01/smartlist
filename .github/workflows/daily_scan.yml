name: EGX Daily Scanner

on:
  schedule:
    # Daily report الساعة 9:00 صبح Cairo
    # November-April: 7:00 UTC (EET = UTC+2)
    - cron: '0 7 * * 0-4'
    # May-October: 6:00 UTC (EEST = UTC+3)
    - cron: '0 6 * * 0-4'

    # كل 5 دقائق من 10:00 لـ 13:55 Cairo — winter (Nov-Apr): 08:00-11:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'
    # كل 5 دقائق من 10:00 لـ 13:55 Cairo — summer (May-Oct): 07:00-10:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-10 * * 0-4'

    # 14:00-14:30 Cairo — winter: 12:00-12:30 UTC
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'
    # 14:00-14:30 Cairo — summer: 11:00-11:30 UTC
    - cron: '0,5,10,15,20,25,30 11 * * 0-4'

  workflow_dispatch:
    inputs:
      force_daily:
        description: 'Force daily scan (test automatic path — no Manual label)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# منع تراكم الـ runs — لو run جديد جاي، يلغي القديم
concurrency:
  group: egx-scanner
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FORCE_DAILY=True للـ morning crons بالظبط (السمر والشتا)
          # بدون ده، لو الـ cron اتأخر ساعة بيعمل continuous scan بدل daily!
          FORCE_DAILY: >-
            ${{
              (github.event.schedule == '0 6 * * 0-4' ||
               github.event.schedule == '0 7 * * 0-4' ||
               github.event.inputs.force_daily == 'true')
              && 'True' || 'False'
            }}
          MANUAL_RUN: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               github.event.inputs.force_daily != 'true')
              && 'True' || 'False'
            }}
        run: python main.py

      - name: Save updated positions
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json scan_results.json signal_history.json || true
          git diff --staged --quiet || git commit -m "Auto-update positions [skip ci]"
          git push || true

      - name: Generate Heatmap
        if: always()
        env:
          WEB_OUT: ./web_deploy
        run: |
          mkdir -p web_deploy
          python heatmap.py
          cp manifest.json sw.js icon.svg web_deploy/

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          force_orphan: true
          commit_message: "Deploy heatmap [skip ci]"
