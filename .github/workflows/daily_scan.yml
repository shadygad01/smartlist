name: EGX Daily Scanner

on:
  schedule:
    # كل 5 دقائق من 08:00 لـ 11:55 UTC (= 10:00–13:55 Cairo)
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'
    # كل 5 دقائق من 12:00 لـ 12:30 UTC (= 14:00–14:30 Cairo)
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'True' || 'False' }}
        run: python main-auto.py
