name: EGX Daily Scanner

on:
  schedule:
    # Daily report at 8:30 AM Cairo (6:30 UTC summer, 5:30 UTC winter)
    - cron: '30 6 * * 0-4'
    
    # Intraday alerts every 5 minutes from 9:00 AM to 2:30 PM Cairo
    # (7:00 AM to 12:59 PM UTC summer)
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-12 * * 0-4'
  
  # Manual run anytime
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
