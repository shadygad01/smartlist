name: EGX Daily Scanner

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # Egypt uses EET (UTC+2) year-round — NO DST since 2011.
    # All times are Cairo = UTC+2. Only one cron per slot (no summer/winter split).
    #
    # Morning Brief الساعة 7:30 Cairo = 05:30 UTC
    - cron: '30 5 * * 0-4'

    # Auto scan كل 5 دقائق من 10:00 لـ 13:55 Cairo = 08:00-11:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'

    # Auto scan 14:00-14:30 Cairo = 12:00-12:30 UTC
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'

  workflow_dispatch:
    inputs:
      force_daily:
        description: 'Force daily scan (test automatic path — no Manual label)'
        required: false
        default: 'false'
        type: boolean
      full_rebuild:
        description: 'Force full rebuild — ignore all caches'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# منع تراكم الـ runs — لو run جديد جاي، يلغي القديم
concurrency:
  group: egx-scanner
  cancel-in-progress: false   # ScanOrchestrator lock is the ONLY deduplication layer

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ── A ── Core scanner + database preparation ──────────────────────────────
  scan_core:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Operations startup check — verify + recover missed jobs
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import json
          from notifications.operations_monitor import OperationsMonitor
          state = OperationsMonitor().startup_check()
          print(json.dumps(state, indent=2, default=str))
          " || true

      - name: Run EGX Scanner — via ScanOrchestrator
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_DAILY: >-
            ${{
              (github.event.schedule == '30 5 * * 0-4' ||
               github.event.inputs.force_daily == 'true')
              && 'True' || 'False'
            }}
          PYTHONUNBUFFERED: "1"
          MANUAL_RUN: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               github.event.inputs.force_daily != 'true')
              && 'True' || 'False'
            }}
        run: |
          python -c "
          from notifications.scan_orchestrator import ScanOrchestrator
          import sys
          ok = ScanOrchestrator().dispatch_from_env()
          sys.exit(0 if ok is not False else 1)
          "

      - name: Refresh historical CSV data
        run: python backfill_egx30.py --download-only || true

      - name: Prepare research database
        run: |
          python backfill_research_db.py || true
          python backfill_signal_log_smc.py || true
          python historical_backtest.py --append || true
          python backfill_hist_features.py || true
          python extend_metrics.py || true
          python -c "from backfill_research_db import ensure_combined_view; ensure_combined_view()" || true
          python cache_orchestrator.py --symbols || true

      - name: Rebuild universe snapshot with fresh prices
        run: |
          python3 - <<'PYEOF'
          from universe_snapshot import build_universe_snapshot
          from stock_dna_engine import build_stock_dna
          build_universe_snapshot()
          build_stock_dna()
          print('Universe snapshot and DNA rebuilt.')
          PYEOF

      - name: Assert price freshness — fail if prices are stale
        run: |
          python3 audit/assert_price_freshness.py

      - name: Build presentation snapshot JSON and assert consistency
        run: |
          python3 - <<'PYEOF'
          from presentation.presentation_snapshot import build_presentation_snapshot, write_presentation_snapshot_json
          snap = build_presentation_snapshot()
          write_presentation_snapshot_json(snap)
          print('presentation_snapshot.json written.')
          PYEOF
          python3 audit/assert_presentation_consistency.py

      - name: CI Protection Gate
        run: |
          python3 audit/assert_ci_protection.py

      - name: Constitutional Golden Master Validation
        run: |
          python3 audit/run_daily_validation.py
          echo "Validation passed — constitutional output identical to golden master."

      - name: Morning Report and self-healing — owned by ScanOrchestrator
        run: |
          echo "Morning report and self-healing cycle are executed inside ScanOrchestrator.run_morning_report()."
          echo "No direct director calls here — single execution path enforced."

      - name: Record heartbeat + scan slot audit
        run: |
          python3 - <<'PYEOF'
          import sys, subprocess, json
          sys.path.insert(0, '.')
          try:
              from operations.heartbeat import update_heartbeat, record_validation
              from operations.sla import record_event
              commit = subprocess.check_output(['git','rev-parse','--short','HEAD'], text=True).strip()
              update_heartbeat(system_status='HEALTHY', commit=commit)
              record_validation(True)
              record_event('validation', True, 'ci_pass')
              record_event('scan', True, 'workflow_complete')
              print('Heartbeat recorded.')
          except Exception as e:
              print(f'Heartbeat error (non-fatal): {e}')
          try:
              from operations.scan_audit import update_operations_state
              state = update_operations_state()
              slots = state.get('scan_slots', {})
              print(f"Scan slots — expected={slots.get('expected',0)} "
                    f"completed={slots.get('completed',0)} "
                    f"skipped={slots.get('skipped_by_lock',0)} "
                    f"missing={slots.get('missing',0)}")
          except Exception as e:
              print(f'Scan audit non-fatal: {e}')
          PYEOF

      - name: Save state to git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json scan_results.json \
                  signal_history.json signal_log.json learned_weights.json \
                  egx_research.db research_results.json \
                  changed_symbols.json presentation_snapshot.json \
                  heartbeat.json operations_state.json \
                  scan_execution.db notification_delivery.db || true
          git add operations/incidents.json operations/sla.json \
                  operations/knowledge.json operations/sent_alerts.json || true
          git add historical_data/historical_data/*.csv || true
          git add audit/daily_validation/ || true
          git diff --staged --quiet || git commit -m "Auto-update positions and research DB [skip ci]"
          git push || true

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: egx-research-db
          path: |
            egx_research.db
            historical_backtest_results.json
            reports/historical_backtest_report_*.html
          retention-days: 1

  # ── B ── Research reports (parallel with C) ───────────────────────────────
  research_reports:
    needs: scan_core
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: egx-research-db

      - name: Restore research cache
        uses: actions/cache@v4
        with:
          path: |
            cache_metadata/
            cached_reports/
          key: research-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: research-cache-${{ runner.os }}-

      - name: Generate reports (incremental)
        env:
          WEB_OUT: ./web_deploy
          REPORT_EMAIL_FROM: ${{ secrets.EMAIL_USER }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          FULL_REBUILD: ${{ github.event.inputs.full_rebuild == 'true' && 'true' || 'false' }}
        run: |
          mkdir -p web_deploy
          python cache_orchestrator.py --mode research
          python - <<'PYEOF'
          import glob, shutil
          for pattern, dest in [
              ("reports/historical_backtest_report_*.html", "web_deploy/historical_backtest_report.html"),
              ("reports/research_report_*.html",            "web_deploy/research_report.html"),
              ("reports/quant_research_report_*.html",      "web_deploy/quant_research_report.html"),
          ]:
              files = sorted(glob.glob(pattern))
              if files:
                  shutil.copy(files[-1], dest)
                  print(f"Copied {files[-1]} -> {dest}")
              else:
                  print(f"WARNING: no {pattern} found")
          PYEOF
          cp historical_backtest_results.json web_deploy/ || true
          cp manifest.json sw.js icon.svg web_deploy/ || true
          # Copy fresh HTML into persistent cache dir so skipped runs still have them
          mkdir -p cached_reports
          for f in web_deploy/historical_backtest_report.html web_deploy/research_report.html web_deploy/quant_research_report.html web_deploy/heatmap.html; do
            [ -f "$f" ] && cp "$f" cached_reports/ || true
          done
          # Restore from cache if any HTML was missing this run
          for f in historical_backtest_report research_report quant_research_report heatmap; do
            [ ! -f "web_deploy/${f}.html" ] && [ -f "cached_reports/${f}.html" ] && cp "cached_reports/${f}.html" "web_deploy/${f}.html" && echo "Restored ${f}.html from cache" || true
          done

      - name: Save research cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            cache_metadata/
            cached_reports/
          key: research-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-web
          path: web_deploy/
          retention-days: 1

  # ── C ── Intelligence engines (parallel with B) ───────────────────────────
  intelligence_jobs:
    needs: scan_core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database
        uses: actions/download-artifact@v4
        with:
          name: egx-research-db

      - name: Restore learning cache
        uses: actions/cache@v4
        with:
          path: |
            cache_metadata/
            gx_learning_memory.json
            gx_research_memory.json
            discount_zone_patterns.json
            smc_rl_weights.json
            walk_forward_state.json
            reports/
          key: intelligence-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: intelligence-cache-${{ runner.os }}-

      - name: Run intelligence engines (incremental)
        env:
          FULL_REBUILD: ${{ github.event.inputs.full_rebuild == 'true' && 'true' || 'false' }}
        run: python cache_orchestrator.py --mode intelligence
        continue-on-error: true

      - name: Save learning cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            cache_metadata/
            gx_learning_memory.json
            gx_research_memory.json
            discount_zone_patterns.json
            smc_rl_weights.json
            walk_forward_state.json
            reports/
          key: intelligence-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Collect intelligence artifacts
        run: |
          mkdir -p web_deploy
          python - <<'PYEOF'
          import glob, shutil
          mappings = [
              ("reports/edge_discovery_report_*.html",   "web_deploy/edge_report.html"),
              ("reports/logic_analysis_report_*.html",   "web_deploy/logic_analysis_report.html"),
              ("reports/weight_optimizer_report_*.html", "web_deploy/weight_optimizer_report.html"),
              ("reports/system_audit_report_*.html",     "web_deploy/system_audit_report.html"),
              ("reports/adaptive_learning_report_*.html","web_deploy/adaptive_learning_report.html"),
              ("reports/gx_learning_report_*.html",      "web_deploy/gx_learning_report.html"),
              ("reports/decision_engine_report_*.html",  "web_deploy/decision_engine_report.html"),
              ("reports/discount_zone_report_*.html",    "web_deploy/discount_zone_report.html"),
              ("reports/multi_period_report_*.html",     "web_deploy/multi_period_report.html"),
              ("reports/smc_rl_report_*.html",           "web_deploy/smc_rl_report.html"),
              ("reports/walk_forward_report_*.html",      "web_deploy/walk_forward_report.html"),
              ("reports/research_memory_report_*.html",  "web_deploy/research_memory_report.html"),
          ]
          for pattern, dest in mappings:
              files = sorted(glob.glob(pattern))
              if files:
                  shutil.copy(files[-1], dest)
                  print(f"Copied {files[-1]} -> {dest}")
              else:
                  print(f"WARNING: no {pattern} found")
          PYEOF
          cp reports/behavior_report.html  web_deploy/behavior_report.html  || true
          cp reports/backtest_report.html  web_deploy/backtest_report.html  || true
          cp logic_analysis_results.json        web_deploy/ || true
          cp optimization_results.json          web_deploy/ || true
          cp system_audit_results.json          web_deploy/ || true
          cp adaptive_learning_results.json     web_deploy/ || true
          cp gx_learning_memory.json            web_deploy/ || true
          cp decision_engine_results.json       web_deploy/ || true
          cp discount_zone_patterns.json        web_deploy/ || true
          cp changed_symbols.json               web_deploy/ || true
          cp incremental_execution_report.json  web_deploy/ || true
          cp smc_rl_weights.json                web_deploy/ || true
          cp walk_forward_state.json            web_deploy/ || true
          cp gx_research_memory.json            web_deploy/ || true

      - name: Upload intelligence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-web
          path: web_deploy/
          retention-days: 1

  # ── D ── Dashboard (after B + C) ─────────────────────────────────────────
  dashboard_build:
    needs: [research_reports, intelligence_jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download research artifacts
        uses: actions/download-artifact@v4
        with:
          name: research-web
          path: web_deploy/
        continue-on-error: true

      - name: Download intelligence artifacts
        uses: actions/download-artifact@v4
        with:
          name: intelligence-web
          path: web_deploy/
        continue-on-error: true

      - name: Generate Master Dashboard — via ScanOrchestrator
        run: |
          python -c "
          from notifications.scan_orchestrator import ScanOrchestrator
          ScanOrchestrator().run_dashboard_refresh()
          " || true
          cp dashboard.html web_deploy/index.html || true

      - name: Upload final web deploy
        uses: actions/upload-artifact@v4
        with:
          name: final-web-deploy
          path: web_deploy/
          retention-days: 1

  # ── E ── Deploy ───────────────────────────────────────────────────────────
  deploy:
    needs: dashboard_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download final web deploy
        uses: actions/download-artifact@v4
        with:
          name: final-web-deploy
          path: web_deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          force_orphan: true
          commit_message: "Deploy dashboard [skip ci]"
