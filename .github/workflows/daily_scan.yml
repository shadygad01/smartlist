name: EGX Daily Scanner

on:
  schedule:
    # ─────────────────────────────────────────────────────────────────────────
    # Daily report الساعة 7:00 صبح Cairo
    # Summer (EEST = UTC+3): 04:00 UTC
    - cron: '0 4 * * 0-4'
    # Winter (EET  = UTC+2): 05:00 UTC
    - cron: '0 5 * * 0-4'

    # كل 5 دقائق من 10:00 لـ 13:55 Cairo
    # Summer (UTC+3): 07:00-10:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-10 * * 0-4'
    # Winter (UTC+2): 08:00-11:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 8-11 * * 0-4'

    # 14:00-14:30 Cairo
    # Summer (UTC+3): 11:00-11:30 UTC
    - cron: '0,5,10,15,20,25,30 11 * * 0-4'
    # Winter (UTC+2): 12:00-12:30 UTC
    - cron: '0,5,10,15,20,25,30 12 * * 0-4'

  workflow_dispatch:
    inputs:
      force_daily:
        description: 'Force daily scan (test automatic path — no Manual label)'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# منع تراكم الـ runs — لو run جديد جاي، يلغي القديم
concurrency:
  group: egx-scanner
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FORCE_DAILY=True للـ morning crons بالظبط (السمر والشتا)
          # بدون ده، لو الـ cron اتأخر ساعة بيعمل continuous scan بدل daily!
          FORCE_DAILY: >-
            ${{
              (github.event.schedule == '0 4 * * 0-4' ||
               github.event.inputs.force_daily == 'true')
              && 'True' || 'False'
            }}
          PYTHONUNBUFFERED: "1"
          MANUAL_RUN: >-
            ${{
              (github.event_name == 'workflow_dispatch' &&
               github.event.inputs.force_daily != 'true')
              && 'True' || 'False'
            }}
        run: python main.py

      - name: Save updated positions
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add open_positions.json positions_history.json scan_results.json signal_history.json signal_log.json learned_weights.json egx_research.db || true
          git diff --staged --quiet || git commit -m "Auto-update positions [skip ci]"
          git pull origin main --rebase || true
          git push || true

      - name: Backfill Research DB + Generate Heatmap and Research Report
        if: always()
        env:
          WEB_OUT: ./web_deploy
          REPORT_EMAIL_FROM: ${{ secrets.EMAIL_USER }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          mkdir -p web_deploy
          python backfill_research_db.py || true
          python backfill_signal_log_smc.py || true
          python heatmap.py
          python research_report.py --no-email --force || true
          # copy report (use python glob to avoid shell glob failure)
          python - <<'PYEOF'
          import glob, shutil, os
          files = sorted(glob.glob("research_report_*.html"))
          if files:
              shutil.copy(files[-1], "web_deploy/research_report.html")
              print(f"Copied {files[-1]} -> web_deploy/research_report.html")
          else:
              print("WARNING: no research_report_*.html found")
          PYEOF
          python quant_research_report.py || true
          python - <<'PYEOF'
          import glob, shutil
          files = sorted(glob.glob("quant_research_report_*.html"))
          if files:
              shutil.copy(files[-1], "web_deploy/quant_research_report.html")
              print(f"Copied {files[-1]} -> web_deploy/quant_research_report.html")
          else:
              print("WARNING: no quant_research_report_*.html found")
          PYEOF
          cp manifest.json sw.js icon.svg web_deploy/

      - name: Run Edge Discovery Engine
        if: always()
        run: |
          python rule_discovery.py
          python edge_report.py
          python - <<'PYEOF'
          import glob, shutil
          files = sorted(glob.glob("edge_discovery_report_*.html"))
          if files:
              shutil.copy(files[-1], "web_deploy/edge_report.html")
              print(f"Copied {files[-1]} -> web_deploy/edge_report.html")
          else:
              print("WARNING: no edge_discovery_report_*.html found")
          PYEOF
        continue-on-error: true

      - name: Generate Behavior Report and Backtest Report
        if: always()
        run: |
          python behavior_report.py || true
          python backtest_analysis.py || true
          cp behavior_report.html web_deploy/behavior_report.html || true
          cp backtest_report.html  web_deploy/backtest_report.html  || true
        continue-on-error: true

      - name: Run Logic Analyzer
        if: always()
        run: |
          python logic_analyzer.py || true
          python - <<'PYEOF'
          import glob, shutil
          files = sorted(glob.glob("logic_analysis_report_*.html"))
          if files:
              shutil.copy(files[-1], "web_deploy/logic_analysis_report.html")
              print(f"Copied {files[-1]} -> web_deploy/logic_analysis_report.html")
          else:
              print("WARNING: no logic_analysis_report_*.html found")
          PYEOF
          cp logic_analysis_results.json web_deploy/ || true
        continue-on-error: true

      - name: Run Weight Optimizer
        if: always()
        run: |
          python weight_optimizer.py || true
          python - <<'PYEOF'
          import glob, shutil
          files = sorted(glob.glob("weight_optimizer_report_*.html"))
          if files:
              shutil.copy(files[-1], "web_deploy/weight_optimizer_report.html")
              print(f"Copied {files[-1]} -> web_deploy/weight_optimizer_report.html")
          else:
              print("WARNING: no weight_optimizer_report_*.html found")
          PYEOF
          cp optimization_results.json web_deploy/ || true
        continue-on-error: true

      - name: Generate Master Dashboard
        if: always()
        run: |
          python dashboard.py || true
          cp dashboard.html web_deploy/index.html || true
        continue-on-error: true

      - name: Save research results
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f egx_research.db research_results.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto-update research DB [skip ci]"
          git pull origin main --rebase || true
          git push || true

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          force_orphan: true
          commit_message: "Deploy heatmap + research report [skip ci]"
