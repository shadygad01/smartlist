name: Dashboard Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'dashboard.html'
      - 'pattern_kb.py'
      - 'signal_db.py'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy 2>/dev/null || true

      - name: Build dashboard
        run: python dashboard.py

      - name: Prepare web deploy
        run: |
          mkdir -p web_deploy
          cp dashboard.html web_deploy/index.html
          cp manifest.json sw.js icon.svg web_deploy/ 2>/dev/null || true

      - name: Download existing gh-pages assets
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          git checkout origin/gh-pages -- . 2>/dev/null || true
          # restore only non-index files from gh-pages
          rsync -av --exclude='index.html' . web_deploy/ 2>/dev/null || true
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          keep_files: true
          commit_message: "Deploy dashboard [skip ci]"
