name: 📊 Dashboard Refresh

# Single responsibility:
# Build presentation snapshot
# Build dashboard
# Deploy to GitHub Pages
#
# No git commit
# No git push
# No self-trigger loop

on:
  repository_dispatch:
    types:
      - dashboard_refresh

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: egx-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  dashboard_refresh:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Refresh prices and universe snapshot
        run: |
          python backfill_egx30.py --download-only || true

          python3 - <<'PYEOF'
          from universe_snapshot import build_universe_snapshot
          from stock_dna_engine import build_stock_dna

          build_universe_snapshot()
          build_stock_dna()

          print("Universe snapshot rebuilt.")
          PYEOF
        continue-on-error: true

      - name: Rebuild presentation snapshot
        run: |
          python3 - <<'PYEOF'
          from presentation.presentation_snapshot import (
              build_presentation_snapshot,
              write_presentation_snapshot_json,
          )

          snap = build_presentation_snapshot()
          write_presentation_snapshot_json(snap)

          print("presentation_snapshot.json written.")
          PYEOF

      - name: Build dashboard
        run: |
          python3 dashboard.py

      - name: Price consistency assertion
        run: |
          python3 audit/assert_price_consistency.py
        continue-on-error: true

      - name: Prepare web deploy
        run: |
          rm -rf web_deploy
          mkdir -p web_deploy

          cp dashboard.html web_deploy/index.html

          cp version.json web_deploy/ 2>/dev/null || true
          cp manifest.json web_deploy/ 2>/dev/null || true
          cp sw.js web_deploy/ 2>/dev/null || true
          cp icon.svg web_deploy/ 2>/dev/null || true
          cp presentation_snapshot.json web_deploy/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          keep_files: true
          commit_message: Deploy dashboard [skip ci]
