name: 📊 Dashboard Refresh

# Single responsibility:
# 1. Build presentation snapshot (Python)
# 2. Build EGX Command Center frontend (Next.js static export)
# 3. Deploy to GitHub Pages
#
# No git commit. No git push. No self-trigger loop.

on:
  repository_dispatch:
    types:
      - dashboard_refresh

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: egx-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  dashboard_refresh:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore live data from data branch
        run: bash ci/restore_data.sh

      # ── Python: rebuild production snapshot ───────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Seed valuation database (fallback when valuation_refresh has not run)
        run: |
          python3 - <<'PYEOF'
          # valuation.db is committed to main by valuation_refresh.yml (weekly).
          # When it is absent (fresh checkout before first valuation run), seed it
          # with entry-price-derived estimates so fair value cards are never empty.
          import sqlite3
          from pathlib import Path
          db = Path('valuation.db')
          has_data = False
          if db.exists():
              try:
                  conn = sqlite3.connect(str(db))
                  has_data = conn.execute('SELECT COUNT(*) FROM valuation_models').fetchone()[0] > 0
                  conn.close()
              except Exception:
                  pass
          if not has_data:
              print('[CI] valuation.db absent or empty — seeding with entry-price estimates')
              import valuation.seed_universe as _su
              _su.run()
          else:
              print(f'[CI] valuation.db present with data — skipping seed')
          PYEOF

      - name: Rebuild presentation snapshot
        run: |
          python3 - <<'PYEOF'
          from presentation.presentation_snapshot import (
              build_presentation_snapshot,
              write_presentation_snapshot_json,
          )
          snap = build_presentation_snapshot()
          write_presentation_snapshot_json(snap)
          print("presentation_snapshot.json written.")
          PYEOF

      - name: Price consistency assertion
        run: python3 audit/assert_price_consistency.py
        continue-on-error: true

      - name: Event timeline consistency (buy signals match dashboard EVENT TIMELINE)
        run: python3 audit/assert_event_timeline_consistency.py
        continue-on-error: true

      # ── Node.js: build Next.js static export ──────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Copy snapshot into public/ for build
        run: cp presentation_snapshot.json frontend/public/presentation_snapshot.json

      - name: Build Next.js static export
        working-directory: frontend
        run: npm run build
        env:
          # Fetch presentation_snapshot.json from same origin at runtime
          # basePath is /smartlist — snapshot must be fetched relative to that path
          NEXT_PUBLIC_SNAPSHOT_URL: /smartlist/presentation_snapshot.json

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Prepare web deploy
        run: |
          rm -rf web_deploy
          mkdir -p web_deploy

          # Copy Next.js static export (replaces legacy dashboard.html)
          cp -r frontend/out/. web_deploy/

          # Ensure snapshot is at root for runtime fetch
          cp presentation_snapshot.json web_deploy/presentation_snapshot.json

          # Keep legacy assets
          cp version.json web_deploy/ 2>/dev/null || true
          cp manifest.json web_deploy/ 2>/dev/null || true
          cp sw.js web_deploy/ 2>/dev/null || true
          cp icon.svg web_deploy/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          keep_files: false
          commit_message: Deploy EGX Command Center [skip ci]
