name: 🔔 Market Notifications

# Intraday market scan — fires every 5 min during EGX trading hours.
# Sends BUY/alert signals via Telegram. No email. No GH Pages deploy.
# GitHub schedule only — external HA triggers (Google Apps Script, cron-job.org)
# route exclusively through external_dispatch.yml to avoid two separate runners
# racing to send the same alert (this workflow used to also listen for
# market_scan/ha_trigger/scan_dispatch, which caused duplicate Telegram+email
# sends when the same repository_dispatch fired both workflows at once).

on:
  schedule:
    # EGX market hours: Sun–Thu 10:00–14:30 Cairo (UTC+3 per ZoneInfo Africa/Cairo).
    # Every 5 min from 10:00–13:55 Cairo = 07:00–10:55 UTC
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 7-10 * * 0-4'
    # 14:00–14:30 Cairo = 11:00–11:30 UTC
    - cron: '0,5,10,15,20,25,30 11 * * 0-4'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: egx-market-notifications
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  market_notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore live data from data branch
        run: bash ci/restore_data.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh prices and universe snapshot
        run: |
          python backfill_egx30.py --download-only || true
          python3 - <<'PYEOF'
          from universe_snapshot import build_universe_snapshot
          from stock_dna_engine import build_stock_dna
          build_universe_snapshot()
          build_stock_dna()
          print('Universe snapshot rebuilt.')
          PYEOF
        continue-on-error: true

      - name: Run Market Scan — via ScanOrchestrator
        env:
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          MANUAL_RUN: "True"
        run: |
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, '.')
          from notifications.scan_orchestrator import ScanOrchestrator
          result = ScanOrchestrator().run_market_scan()
          print(f"[MarketNotifications] result={result}")
          sys.exit(0)
          PYEOF

      - name: Consistency assertions
        run: python operations/consistency_check.py

      - name: Update public status
        run: |
          python - <<'PYEOF'
          import sys, json
          sys.path.insert(0, '.')
          try:
              from operations.github_health import check, write_public_status
              public = write_public_status()
              result = check()
              print(f"Health: {result['status']}")
              print(json.dumps(public, indent=2))
          except Exception as e:
              print(f"public_status update non-fatal: {e}")
          PYEOF
        continue-on-error: true

      - name: Rebuild presentation snapshot
        run: |
          python3 - <<'PYEOF'
          from presentation.presentation_snapshot import (
              build_presentation_snapshot,
              write_presentation_snapshot_json,
          )
          snap = build_presentation_snapshot()
          write_presentation_snapshot_json(snap)
          print("presentation_snapshot.json written.")
          PYEOF

      - name: Rebuild dashboard HTML
        run: python3 dashboard.py

      - name: Persist state to data branch
        run: |
          bash ci/save_data.sh "Market scan: state update [skip ci]"

      - name: Prepare web deploy
        run: |
          mkdir -p web_deploy
          cp version.json web_deploy/ 2>/dev/null || true
          cp manifest.json web_deploy/ 2>/dev/null || true
          cp sw.js web_deploy/ 2>/dev/null || true
          cp icon.svg web_deploy/ 2>/dev/null || true
          cp presentation_snapshot.json web_deploy/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          keep_files: true
          commit_message: "Market scan: deploy dashboard [skip ci]"
