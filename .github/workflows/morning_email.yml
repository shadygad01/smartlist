name: 📧 Morning Email + Dashboard Deploy

# Sends morning constitutional brief via email + Telegram, then rebuilds
# the universe snapshot, presentation snapshot, dashboard, and deploys to GH Pages.
# Triggered by Google Apps Script (repository_dispatch) or GitHub schedule as backup.
#
# EXECUTION ORDER:
#   1. Refresh CSVs (backfill_egx30)
#   2. Morning report — build_report() now internally:
#        a. analyze() fetches live TV prices into results dict
#        b. save_signal_history(results) → signal_history.json (today's prices)
#        c. build_universe_snapshot() → universe_snapshot.db (refreshed with today's prices)
#        d. build_presentation_snapshot() → PresentationSnapshot (reads fresh universe_snapshot.db)
#        e. build_email(snap) → email HTML — prices match universe_snapshot.db
#      Email and dashboard therefore show IDENTICAL current prices (price parity enforced).
#   3. Rebuild universe_snapshot.db again (idempotent — for dashboard + GH Pages)
#   4. Rebuild presentation_snapshot.json (idempotent — canonical JSON artifact)
#   5. Build dashboard — ONE snapshot, ONE html, ONE deploy
#   6. Deploy to GH Pages

on:
  repository_dispatch:
    types:
      - morning_report
      - morning_dispatch

  schedule:
    # 07:30 Cairo (UTC+3 per ZoneInfo Africa/Cairo) = 04:30 UTC, Sun–Thu
    - cron: '30 4 * * 0-4'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force send even if already sent today'
        required: false
        default: 'false'
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: egx-morning-email
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  morning_email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize scan context (scan UUID for this run)
        run: python3 scan_context.py --init --force

      - name: Refresh historical CSV data
        run: python backfill_egx30.py --download-only || true

      - name: Rebuild candidate pool (today's signals — fast daily refresh)
        # Ensures constitutional R2 data is fresh before detect_signal_changes() runs.
        # Uses --today flag: only scans the last 7 calendar days (< 60s for 27 symbols).
        run: python candidate_pool_builder.py --today || true

      - name: Send Morning Email + Telegram Brief
        env:
          EMAIL_USER:       ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:       ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          FORCE_DAILY: "True"
          FORCE_RESEND: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        run: |
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, '.')
          from notifications.scan_orchestrator import ScanOrchestrator
          result = ScanOrchestrator().run_morning_report()
          print(f"[MorningEmail] result={result}")
          sys.exit(0)
          PYEOF

      - name: Rebuild universe snapshot with today's prices
        # Must run AFTER morning_report so signal_history.json has today's live prices.
        # PriceAuthority reads universe_snapshot.db — this step makes it authoritative.
        run: |
          python3 - <<'PYEOF'
          from universe_snapshot import build_universe_snapshot
          from stock_dna_engine import build_stock_dna
          build_universe_snapshot()
          build_stock_dna()
          print('Universe snapshot and DNA rebuilt with today prices.')
          PYEOF

      - name: Rebuild presentation snapshot (uses PriceAuthority)
        run: |
          python3 - <<'PYEOF'
          from presentation.presentation_snapshot import build_presentation_snapshot, write_presentation_snapshot_json
          snap = build_presentation_snapshot()
          write_presentation_snapshot_json(snap)
          print('presentation_snapshot.json written.')
          PYEOF

      - name: Build dashboard
        run: python3 dashboard.py || true

      - name: Consistency assertions
        run: python operations/consistency_check.py

      - name: Price consistency assertion (ONE ticker = ONE price)
        run: python3 audit/assert_price_consistency.py

      - name: Email price parity assertion (email == dashboard == universe_snapshot.db)
        run: python3 audit/assert_email_price_parity.py

      - name: Signal idempotency assertion (10 scans = 1 notification)
        run: python3 audit/assert_signal_idempotency.py

      - name: Constitutional decision consistency (ONE gate = ONE decision)
        run: python3 audit/assert_decision_consistency.py

      - name: Build production decision snapshot
        run: python3 audit/build_production_decision_snapshot.py

      - name: Build decision diff (explain every BUY/RE-ACCUM addition/removal)
        run: python3 audit/build_decision_diff.py

      - name: Full universe replay (all tickers — gate is reproducible)
        run: python3 audit/assert_full_universe_replay.py

      - name: Cross-layer consistency (gate == dashboard == email == snapshot)
        run: python3 audit/assert_cross_layer_consistency.py

      - name: Rendered output validation (dashboard matches production snapshot)
        run: python3 audit/assert_rendered_output.py

      - name: Event chain integrity (signal → timeline → presentation)
        run: python3 audit/assert_event_chain_integrity.py

      - name: Data freshness (no stale sources)
        run: python3 audit/assert_data_freshness.py

      - name: Decision replay (5 tickers — gate is reproducible)
        run: python3 audit/assert_decision_replay.py

      - name: Regression suite (all previously fixed bugs)
        run: python3 audit/assert_regression_suite.py

      - name: MPI pipeline integrity (behavioral analysis end-to-end)
        run: python3 audit/assert_mpi_pipeline.py

      - name: Build constitutional fingerprint
        run: python3 audit/build_constitutional_fingerprint.py || true

      - name: Build architecture fingerprint
        run: python3 audit/build_architecture_fingerprint.py || true

      - name: Build scan manifest (immutable per-scan artifact record)
        run: python3 audit/build_scan_manifest.py

      - name: Constitutional consistency report (final)
        run: python3 audit/run_consistency_report.py

      - name: Update public status
        run: |
          python - <<'PYEOF'
          import sys, json
          sys.path.insert(0, '.')
          try:
              from operations.github_health import check, write_public_status
              public = write_public_status()
              result = check()
              print(f"Health: {result['status']}")
              print(json.dumps(public, indent=2))
          except Exception as e:
              print(f"public_status update non-fatal: {e}")
          PYEOF
        continue-on-error: true

      - name: Save state to git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add heartbeat.json operations_state.json operations/public_status.json \
                  scan_execution.db notification_delivery.db \
                  presentation_snapshot.json production_decision_snapshot.json \
                  constitutional_fingerprint.json architecture_fingerprint.json \
                  scan_manifest.json consistency_report.json scan_context.json \
                  version.json dashboard.html signal_history.json \
                  mpi_snapshots.db decision_diff.json || true
          git add historical_data/historical_data/*.csv || true
          git diff --staged --quiet || git commit -m "Morning email: full state update [skip ci]"
          git push || true

      - name: Prepare web deploy
        run: |
          mkdir -p web_deploy
          cp dashboard.html web_deploy/index.html
          cp version.json web_deploy/ 2>/dev/null || true
          cp manifest.json sw.js icon.svg web_deploy/ 2>/dev/null || true

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_deploy
          keep_files: true
          commit_message: "Morning email: deploy dashboard [skip ci]"
