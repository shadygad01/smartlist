name: EGX SMC Scanner

on:
  schedule:
    # 8:30 AM Cairo time (UTC+3 summer) = 05:30 UTC
    # EGX trading days: Sunday–Thursday
    - cron: '30 5 * * 0'   # Sunday
    - cron: '30 5 * * 1'   # Monday
    - cron: '30 5 * * 2'   # Tuesday
    - cron: '30 5 * * 3'   # Wednesday
    - cron: '30 5 * * 4'   # Thursday
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EGX SMC Scanner
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit ORAS CSV history if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oras_history.csv signals_history.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update scanner history [skip ci]"
          git push || true
