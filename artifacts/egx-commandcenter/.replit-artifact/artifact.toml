kind = "web"
previewPath = "/"
title = "EGX CommandCenter"
version = "1.0.0"
id = "artifacts/egx-commandcenter"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21744

[services.development]
run = "pnpm --filter @workspace/egx-commandcenter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/egx-commandcenter", "run", "build" ]
publicDir = "artifacts/egx-commandcenter/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21744"
BASE_PATH = "/"
